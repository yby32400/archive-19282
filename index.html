<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSID KAREN ARCHIVE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <style>
        /* [1] 전체 테마 및 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #050505; color: #fff; line-height: 1.6; 
            padding-top: 70px; overflow-x: hidden; 
        }
        a { text-decoration: none; color: inherit; cursor: pointer; }

        /* [2] 네온 & 라운딩 효과 (예쁜 디자인 다 때려넣기) */
        .neon-text { color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px #a855f7, 0 0 30px #a855f7; }
        .neon-text-sub { color: #e9d5ff; text-shadow: 0 0 8px #a855f7; font-weight: 700; }
        .neon-box { 
            border: 1px solid rgba(168, 85, 247, 0.5); 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); 
            border-radius: 15px !important; /* 둥근 모서리 */
            overflow: hidden; 
        }

        /* [3] 상단 네비게이션 (모바일 글자 뭉침 차단) */
        .sticky_nav { 
            position: fixed; top: 0; left: 0; width: 100%; height: 70px; 
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px); 
            z-index: 99999; border-bottom: 1px solid rgba(168, 85, 247, 0.3); 
            display: flex; justify-content: center; align-items: center; 
        }
        .nav-inner { width: 100%; max-width: 1200px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo a { font-weight: 800; font-size: 20px; text-shadow: 0 0 10px #a855f7; white-space: nowrap; }

        .nav-menu { display: flex; gap: 20px; }
        .m-menu-btn { display: none; flex-direction: column; justify-content: space-between; width: 25px; height: 18px; background: none; border: none; cursor: pointer; z-index: 100001; }
        .m-menu-btn span { display: block; width: 100%; height: 3px; background: #a855f7; border-radius: 3px; transition: 0.3s; }

        @media (max-width: 768px) {
            .m-menu-btn { display: flex; }
            .nav-menu {
                position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
                background: #000; flex-direction: column; justify-content: center; align-items: center;
                gap: 35px; display: none !important; z-index: 10000;
            }
            .nav-menu.active { display: flex !important; }
            .nav-menu a { font-size: 26px; color: #fff; text-shadow: 0 0 15px #a855f7; }
            
            /* 햄버거 -> X 변신 */
            .m-menu-btn.active span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
            .m-menu-btn.active span:nth-child(2) { opacity: 0; }
            .m-menu-btn.active span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
        }

        /* [4] 달력 (7열 고정 및 라운딩) */
        .calendar-grid { display: none !important; grid-template-columns: repeat(7, 1fr); gap: 8px; width: 100%; max-width: 500px; margin: 0 auto; }
        .calendar-grid.active-month { display: grid !important; }
        .day-cell { position: relative; aspect-ratio: 1 / 1.4; background: #111; border: 1px solid #222; border-radius: 10px; overflow: hidden; }
        .event-img { width: 100%; height: 100%; object-fit: cover; }
        .day-num { position: absolute; top: 5px; left: 5px; font-size: 11px; color: #444; }
        .has-event { border: 1px solid #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }

        /* [5] 리스트 및 컨테이너 */
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .page-section { display: none; width: 100%; }
        .page-section.active { display: block; }
        
        .list-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; margin-top: 30px; }
        .post-item { background: #111; border-radius: 15px; border: 1px solid #333; overflow: hidden; text-align: left; }
        .thumb { width: 100%; aspect-ratio: 16 / 9; background: #222; }
        .text-box { padding: 15px; }

        .video-frame { width: 100%; max-width: 800px; aspect-ratio: 16 / 9; margin: 0 auto 40px; }
    </style>
</head>
<body>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <button class="m-menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></button>
        <div class="nav-menu" id="mobileMenu">
            <a href="#home" onclick="toggleMenu()">HOME</a>
            <a href="#sns" onclick="toggleMenu()">SNS</a>
            <a href="#notice" onclick="toggleMenu()">NOTICE</a>
            <a href="#cheki" onclick="toggleMenu()">CHEKI</a>
            <a href="#guestbook" onclick="toggleMenu()">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <main class="container">
        <div class="video-frame neon-box">
            <iframe src="https://drive.google.com/file/d/1-ZyXQgAyqs2yzi3NlkEok81UKe7pKP1T/preview" frameborder="0" style="width:100%; height:100%;" allowfullscreen></iframe>
        </div>
        <h2 class="neon-text" style="font-size: 2.5rem; margin-bottom: 60px;">OBSID KAREN ARCHIVE</h2>
        
        <section class="content-section" id="anchor-schedule">
            <h2 class="neon-text-sub" style="margin-bottom:20px;">OFFICIAL SCHEDULE</h2>
            <div class="calendar-header" style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
                <button onclick="changeMonth(-1)" style="background:none; border:1px solid #a855f7; color:#fff; width:35px; height:35px; border-radius:50%; cursor:pointer;">◀</button>
                <h2 id="current-month-title" class="neon-text" style="min-width:160px; font-size: 1.4rem;">JANUARY 2026</h2>
                <button onclick="changeMonth(1)" style="background:none; border:1px solid #a855f7; color:#fff; width:35px; height:35px; border-radius:50%; cursor:pointer;">▶</button>
            </div>
            <div id="calendar-body"></div>
        </section>

        <section class="content-section" style="margin-top: 80px;">
            <h2 class="neon-text-sub" style="margin-bottom:30px;">LATEST MEDIA</h2>
            <div class="list-wrap" id="media-list-container"></div>
        </section>
    </main>
</div>

<div id="page-sns" class="page-section"><main class="container"><h2 class="neon-text-sub">SNS FEED</h2><div class="neon-box" style="max-width:500px; margin:40px auto; overflow:hidden;"><a class="twitter-timeline" data-theme="dark" data-height="600" href="https://twitter.com/Official_Obsid">Tweets</a><script async src="https://platform.twitter.com/widgets.js"></script></div></main></div>

<div id="page-notice" class="page-section"><main class="container"><h2 class="neon-text-sub">NOTICE</h2><div class="list-wrap" id="notice-list-container"></div></main></div>

<div id="page-cheki" class="page-section"><main class="container"><h2 class="neon-text-sub">CHEKI LOG</h2><div class="list-wrap" id="cheki-list-container"></div></main></div>

<div id="page-guestbook" class="page-section"><main class="container"><h2 class="neon-text-sub">GUESTBOOK</h2><p style="margin-top:40px; color:#666;">준비 중입니다.</p></main></div>

<script>
    /* [데이터 설정 구역 - 여기에 정보를 입력하세요] */
    const mySchedule = {
        "1-3": { img: "https://pbs.twimg.com/media/G-ubDR3bAAAeXV-?format=jpg&name=large", link: "#" },
        "1-29": { img: "https://pbs.twimg.com/media/G-ubDR3bAAAeXV-?format=jpg&name=large", link: "#" }
    };

    const mediaPosts = [
        { title: "페르소나5 플레이 영상", date: "2026.01.15", img: "https://images.unsplash.com/photo-1635322966219-b75ed3a90e27?auto=format&fit=crop&w=800&q=80" }
    ];

    const noticePosts = [
        { title: "아카이브 오픈 안내", date: "2026.01.18", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80" }
    ];

    const chekiPosts = [
        { title: "1월 29일 체키 정산", date: "2026.01.29", img: "https://images.unsplash.com/photo-1595079676339-1534801ad6cf?auto=format&fit=crop&w=800&q=80" }
    ];

    /* [기능 구역 - 건드리지 마세요] */
    function toggleMenu() {
        document.getElementById('mobileMenu').classList.toggle('active');
        document.querySelector('.m-menu-btn').classList.toggle('active');
    }

    function handleRouting() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('page-' + hash);
        if(target) target.classList.add('active');
        window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', handleRouting);

    const year = 2026; let currentIdx = 0;
    const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

    function initCalendar() {
        const b = document.getElementById('calendar-body'); if(!b) return;
        let h = '';
        for (let m=0; m<12; m++) {
            const f = new Date(year, m, 1).getDay(); const l = new Date(year, m+1, 0).getDate();
            h += `<div class="calendar-grid ${m===currentIdx ? 'active-month' : ''}" id="month-${m}">`;
            for(let i=0; i<f; i++) h += `<div class="day-cell"></div>`;
            for(let d=1; d<=l; d++) {
                const k = `${m+1}-${d}`; const ev = mySchedule[k];
                h += ev ? `<div class="day-cell has-event"><span class="day-num">${d}</span><img src="${ev.img}" class="event-img"></div>` : `<div class="day-cell"><span class="day-num">${d}</span></div>`;
            }
            h += `</div>`;
        }
        b.innerHTML = h;
    }

    function changeMonth(s) {
        document.getElementById(`month-${currentIdx}`).classList.remove('active-month');
        currentIdx = (currentIdx + s + 12) % 12;
        document.getElementById(`month-${currentIdx}`).classList.add('active-month');
        document.getElementById('current-month-title').innerText = `${monthNames[currentIdx]} ${year}`;
    }

    function renderList(data, id) {
        const c = document.getElementById(id); if(!c || !data) return;
        c.innerHTML = data.map(p => `
            <div class="post-item neon-box">
                <div class="thumb"><img src="${p.img}" style="width:100%; height:100%; object-fit:cover;"></div>
                <div class="text-box"><h3>${p.title}</h3><p style="font-size:12px; color:#888;">${p.date}</p></div>
            </div>
        `).join('');
    }

    document.addEventListener("DOMContentLoaded", () => {
        initCalendar();
        handleRouting();
        renderList(mediaPosts, 'media-list-container');
        renderList(noticePosts, 'notice-list-container');
        renderList(chekiPosts, 'cheki-list-container');
    });
</script>
</body>
</html>
