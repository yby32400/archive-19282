<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSID KAREN ARCHIVE</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
</head>

<body>
<div id="loading-screen"><div class="loading-logo">OBSID ARCHIVE</div></div>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <div class="nav-menu">
            <a href="#notice">NOTICE</a>
            <a href="#cheki">CHEKI</a>
            <a href="#guestbook">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <header class="hero-section" style="text-align:center; padding:100px 20px;">
        <div class="video-frame neon-box" style="max-width:800px; margin:0 auto; aspect-ratio:16/9; overflow:hidden;">
            <iframe src="https://drive.google.com/file/d/1-ZyXQgAyqs2yzi3NlkEok81UKe7pKP1T/preview" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <h2 class="main-copy neon-text" style="font-size:3rem; margin-top:30px;">OBSID KAREN<br>ARCHIVE</h2>
    </header>

    <main>
        <div id="anchor-schedule" class="container">
            <div class="section-header" style="text-align:center; margin-bottom:50px;"><h2 class="neon-text-sub">OFFICIAL SCHEDULE</h2></div>
            <div id="calendar-body"></div>
        </div>
        
        <div class="content-section-full">
            <div class="section-header" style="text-align:center;"><h2 class="neon-text-sub">OFFICIAL X</h2></div>
            <a href="https://x.com/Obsid_ofcl" target="_blank" class="official-banner-link">
                <div class="banner-wrapper-full">
                    <img src="https://pbs.twimg.com/profile_banners/1965985666375819264/1762981893/1080x360" class="banner-img">
                    <div class="banner-overlay"><span>옵시드 공식 X 바로가기</span></div>
                </div>
            </a>
        </div>

        <div class="container">
            <div class="section-header" style="text-align:center;"><h2 class="neon-text-sub">LATEST MEDIA</h2></div>
            <div class="list-wrap" id="media-list-container"></div>
        </div>
    </main>
</div>

<div id="page-guestbook" class="page-section">
    <main class="container">
        <div class="section-header" style="text-align:center;"><h2 class="neon-text-sub">GUESTBOOK</h2></div>
        <div class="neon-box" style="min-height:400px; padding:10px; background:#000; border-radius:12px;">
            <div style="text-align:center; padding:100px 0; color:#444;">Cbox Loading...</div>
        </div>
    </main>
</div>

<div id="article-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeModal(event)">×</button>
        <div id="modal-img-container"></div>
        <div class="modal-body">
            <h2 id="modal-title" class="modal-title"></h2>
            <span id="modal-date" class="modal-date"></span>
            <p id="modal-text" class="modal-text"></p>
        </div>
    </div>
</div>

<a href="https://github.com/아이디/저장소/edit/main/data.js" target="_blank" class="admin-btn"></a>

<script src="./data.js"></script>
<script>
    function forceHideLoader() {
        const loader = document.getElementById('loading-screen');
        if(loader) {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 800);
        }
    }

    function renderList(data, id, type) {
        const c = document.getElementById(id); if(!c || !data) return;
        let h = "";
        data.forEach((p, i) => {
            let thumb = (p.images && p.images[0]) || p.img || "";
            if(type === 'link') h += `<a href="${p.link||'#'}" target="_blank" class="post-item"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><h3>${p.title}</h3><span>${p.date}</span></div></a>`;
            else h += `<div class="post-item" onclick="openModal('${id}', ${i})"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><h3>${p.title}</h3><span>${p.date}</span></div></div>`;
        });
        c.innerHTML = h;
    }

    function openModal(type, index) {
        let post = (type.includes('cheki')) ? chekiPosts[index] : noticePosts[index];
        const imgContainer = document.getElementById('modal-img-container');
        imgContainer.innerHTML = "";
        if(post.images) post.images.forEach(s => imgContainer.innerHTML += `<img src="${s}" style="width:100%;">`);
        else if(post.img) imgContainer.innerHTML = `<img src="${post.img}" style="width:100%;">`;
        document.getElementById('modal-title').innerText = post.title;
        document.getElementById('modal-text').innerText = post.body;
        document.getElementById('article-modal').style.display = 'block';
    }

    function closeModal(e) { if(e.target.id === 'article-modal' || e.target.classList.contains('modal-close-btn')) document.getElementById('article-modal').style.display = 'none'; }

    document.addEventListener("DOMContentLoaded", () => {
        try {
            renderList(typeof noticePosts !== 'undefined' ? noticePosts : [], 'notice-list-container', 'notice');
            renderList(typeof chekiPosts !== 'undefined' ? chekiPosts : [], 'cheki-list-container', 'card');
            renderList(typeof mediaPosts !== 'undefined' ? mediaPosts : [], 'media-list-container', 'link');
        } catch(e) { console.error(e); }
        finally { setTimeout(forceHideLoader, 1500); }
    });
</script>
</body>
</html>
