<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSID KAREN ARCHIVE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        /* [이 파일 하나에 모든 디자인을 넣었습니다] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background: #050505; color: #fff; padding-top: 70px; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        .neon-text { text-shadow: 0 0 10px #a855f7; font-weight: 800; color: #fff; }
        
        /* 네비게이션 */
        .sticky_nav { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); z-index: 9999; display: flex; justify-content: center; border-bottom: 1px solid #333; }
        .nav-inner { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        
        /* 메뉴 뭉침 방지 핵심 */
        .nav-menu { display: flex; gap: 20px; }
        @media (max-width: 768px) {
            .nav-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; flex-direction: column; justify-content: center; align-items: center; display: none; }
            .nav-menu.active { display: flex; }
            .m-menu-btn { display: flex !important; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; z-index: 10000; }
            .m-menu-btn span { width: 25px; height: 3px; background: #a855f7; border-radius: 2px; }
        }
        .m-menu-btn { display: none; }

        /* 달력 */
        .calendar-grid { display: none; grid-template-columns: repeat(7, 1fr); gap: 5px; width: 100%; max-width: 500px; margin: 20px auto; }
        .calendar-grid.active-month { display: grid; }
        .day-cell { aspect-ratio: 1/1.3; background: #111; border: 1px solid #222; border-radius: 8px; position: relative; overflow: hidden; }
        .day-num { position: absolute; top: 3px; left: 5px; font-size: 10px; color: #555; }
        .event-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 페이지 섹션 */
        .page-section { display: none; padding: 20px; text-align: center; }
        .page-section.active { display: block; }
        .container { max-width: 1200px; margin: 0 auto; }
        .list-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .post-item { background: #111; border-radius: 12px; border: 1px solid #333; overflow: hidden; }
        .thumb { aspect-ratio: 16/9; background: #222; }
    </style>
</head>
<body>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <button class="m-menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></button>
        <div class="nav-menu" id="mobileMenu">
            <a href="#home" onclick="toggleMenu()">HOME</a>
            <a href="#sns" onclick="toggleMenu()">SNS</a>
            <a href="#notice" onclick="toggleMenu()">NOTICE</a>
            <a href="#cheki" onclick="toggleMenu()">CHEKI</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <div class="container">
        <h2 class="neon-text" style="font-size: 2rem; margin: 40px 0;">OFFICIAL SCHEDULE</h2>
        <div style="margin-bottom: 20px;">
            <button onclick="changeMonth(-1)" style="padding: 10px; background: none; border: 1px solid #a855f7; color: #fff; border-radius: 50%;">◀</button>
            <span id="month-title" style="margin: 0 20px; font-size: 1.2rem;">JANUARY 2026</span>
            <button onclick="changeMonth(1)" style="padding: 10px; background: none; border: 1px solid #a855f7; color: #fff; border-radius: 50%;">▶</button>
        </div>
        <div id="calendar-body"></div>
        
        <h2 class="neon-text" style="font-size: 2rem; margin: 60px 0 20px;">LATEST MEDIA</h2>
        <div class="list-wrap" id="media-list"></div>
    </div>
</div>

<div id="page-sns" class="page-section"><div class="container"><h2>SNS FEED</h2><div style="margin-top:40px;">트위터 위젯 등</div></div></div>
<div id="page-notice" class="page-section"><div class="container"><h2>NOTICE</h2><div class="list-wrap" id="notice-list"></div></div></div>
<div id="page-cheki" class="page-section"><div class="container"><h2>CHEKI LOG</h2><div class="list-wrap" id="cheki-list"></div></div></div>

<script>
    /* [데이터와 기능을 한곳에 모았습니다] */
    const mySchedule = {"1-29": {img: "https://picsum.photos/200/300", link: "#"}};
    const mediaPosts = [{title: "페르소나5 플레이 영상", date: "2026.01.15", img: "https://picsum.photos/400/225"}];
    const noticePosts = [{title: "아카이브 오픈 안내", date: "2026.01.18", img: ""}];

    let currentMonth = 0;
    const months = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

    function toggleMenu() {
        document.getElementById('mobileMenu').classList.toggle('active');
    }

    function handleRouting() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('page-' + hash);
        if(target) target.classList.add('active');
        window.scrollTo(0,0);
    }
    window.addEventListener('hashchange', handleRouting);

    function initCalendar() {
        const body = document.getElementById('calendar-body');
        let html = '';
        for(let m=0; m<12; m++) {
            const days = new Date(2026, m+1, 0).getDate();
            const firstDay = new Date(2026, m, 1).getDay();
            html += `<div class="calendar-grid ${m===currentMonth?'active-month':''}" id="m-${m}">`;
            for(let i=0; i<firstDay; i++) html += `<div class="day-cell"></div>`;
            for(let d=1; d<=days; d++) {
                const event = mySchedule[`${m+1}-${d}`];
                html += `<div class="day-cell"><span class="day-num">${d}</span>${event?`<img src="${event.img}" class="event-img">`:''}</div>`;
            }
            html += `</div>`;
        }
        body.innerHTML = html;
    }

    function changeMonth(step) {
        document.getElementById(`m-${currentMonth}`).classList.remove('active-month');
        currentMonth = (currentMonth + step + 12) % 12;
        document.getElementById(`m-${currentMonth}`).classList.add('active-month');
        document.getElementById('month-title').innerText = `${months[currentMonth]} 2026`;
    }

    function renderItems(data, id) {
        const container = document.getElementById(id);
        if(!container) return;
        container.innerHTML = data.map(item => `
            <div class="post-item">
                <div class="thumb"><img src="${item.img}" style="width:100%; height:100%; object-fit:cover;"></div>
                <div style="padding:15px;"><h3>${item.title}</h3><p style="color:#888; font-size:12px;">${item.date}</p></div>
            </div>
        `).join('');
    }

    document.addEventListener("DOMContentLoaded", () => {
        initCalendar();
        renderItems(mediaPosts, 'media-list');
        renderItems(noticePosts, 'notice-list');
        handleRouting();
    });
</script>
</body>
</html>
