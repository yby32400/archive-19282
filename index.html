<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSID KAREN ARCHIVE</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

<style>
/* 가로 꽉 찬 배너 인터랙션 디자인 */
.content-section-full {
    width: 100vw; position: relative;
    left: 50%; right: 50%;
    margin-left: -50vw; margin-right: -50vw;
    margin-top: 80px; margin-bottom: 50px;
}
.official-banner-link { display: block; width: 100%; overflow: hidden; position: relative; }
.banner-wrapper-full { position: relative; width: 100%; overflow: hidden; line-height: 0; }
.banner-img { 
    width: 100%; height: auto; object-fit: cover; 
    transition: filter 0.5s ease, transform 0.5s ease; filter: brightness(0.8); 
}
.banner-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(168, 85, 247, 0.3); display: flex; 
    justify-content: center; align-items: center; opacity: 0; transition: 0.5s ease;
}
.banner-overlay span {
    color: #fff; font-weight: 900; font-size: 1.5rem; text-shadow: 0 0 15px #a855f7;
    border: 2px solid #fff; padding: 15px 35px; border-radius: 50px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    transform: translateY(20px); transition: transform 0.5s ease;
}
.official-banner-link:hover .banner-img { filter: blur(8px) brightness(0.6); transform: scale(1.05); }
.official-banner-link:hover .banner-overlay { opacity: 1; }
.official-banner-link:hover .banner-overlay span { transform: translateY(0); }
</style>
</head>

<body>

<div id="loading-screen">
    <div class="loading-logo">OBSID ARCHIVE</div>
    <div class="loading-text">SYSTEM INITIALIZING...</div>
</div>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <div class="nav-menu">
            <a href="#notice">NOTICE</a>
            <a href="#cheki">CHEKI</a>
            <a href="#guestbook">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <header class="hero-section">
        <div class="video-frame neon-box">
            <iframe src="https://drive.google.com/file/d/1-ZyXQgAyqs2yzi3NlkEok81UKe7pKP1T/preview" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="hero-content">
            <p class="d-day neon-text-sub">TODAY'S MOOD</p>
            <h2 class="main-copy neon-text">OBSID KAREN<br>ARCHIVE</h2>
            <span class="scroll-down" onclick="document.getElementById('anchor-schedule').scrollIntoView({behavior:'smooth'})">▼ SCROLL DOWN</span>
        </div>
    </header>
    
    <main class="container">
        <div id="anchor-schedule" class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">OFFICIAL SCHEDULE</h2><p>2026 CALENDAR</p></div>
            <div class="schedule-wrapper">
                <div class="calendar-header">
                    <button type="button" class="nav-btn" onclick="changeMonth(-1)">◀</button>
                    <h2 id="current-month-title" class="month-title">JANUARY<br>2026</h2>
                    <button type="button" class="nav-btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div id="calendar-body"></div>
            </div>
        </div>
        
        <div class="content-section-full">
            <div class="section-header" style="text-align:center;"><h2 class="neon-text-sub">OFFICIAL X</h2><p>REALTIME FEED</p></div>
            <a href="https://x.com/Obsid_ofcl" target="_blank" class="official-banner-link">
                <div class="banner-wrapper-full">
                    <img src="https://pbs.twimg.com/profile_banners/1965985666375819264/1762981893/1080x360" class="banner-img">
                    <div class="banner-overlay"><span>옵시드 공식 X 바로가기</span></div>
                </div>
            </a>
        </div>

        <div class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">LATEST MEDIA</h2><p>VIDEO & PHOTO</p></div>
            <div class="list-wrap" id="media-list-container"></div>
        </div>
    </main>
</div>

<div id="page-notice" class="page-section">
    <main class="container"><div class="notice-list" id="notice-list-container"></div></main>
</div>
<div id="page-cheki" class="page-section">
    <main class="container"><div class="list-wrap" id="cheki-list-container"></div></main>
</div>
<div id="page-guestbook" class="page-section">
    <main class="container"><div class="cbox-wrapper" id="cbox-container" style="min-height:400px; background:#111;">Cbox Here</div></main>
</div>

<div id="article-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeModal(event)">×</button>
        <div id="modal-img-container" style="width:100%; background:#000;"></div>
        <div class="modal-body">
            <h2 id="modal-title" class="modal-title"></h2>
            <span id="modal-date" class="modal-date"></span>
            <p id="modal-text" class="modal-text"></p>
        </div>
    </div>
</div>

<a href="https://github.com/아이디입력/저장소명입력/edit/main/data.js" target="_blank" class="admin-btn" title="ADMIN">⚙️</a>

<script src="./data.js"></script>
<script>
    /* --- 1. 리스트 렌더링 기능 (미디어, 체키, 공지) --- */
    function renderList(data, id, type) {
        const c = document.getElementById(id); if(!c) return;
        let h = "";
        if(!data || data.length === 0) return;
        data.forEach((p, i) => {
            let thumb = (p.images && p.images[0]) || p.img || "";
            if(type === 'link') {
                h += `<a href="${p.link||'#'}" target="_blank" class="post-item"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><span class="category-label">${p.tag||'MEDIA'}</span><h3 class="title">${p.title}</h3><span class="date">${p.date}</span></div></a>`;
            } else if (type === 'notice') {
                h += `<div class="notice-item" onclick="openModal('notice-list-container', ${i})"><div class="notice-title">${p.title}</div><div class="notice-date">${p.date}</div><div class="notice-body-preview">${p.body}</div></div>`;
            } else {
                h += `<div class="post-item" onclick="openModal('${id}', ${i})"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><span class="category-label">${p.tag||'CHEKI'}</span><h3 class="title">${p.title}</h3><span class="date">${p.date}</span></div></div>`;
            }
        });
        c.innerHTML = h;
    }

    /* --- 2. 상세 모달 열기/닫기 --- */
    function openModal(type, index) {
        let post;
        if(type === 'cheki-list-container') post = chekiPosts[index];
        else if(type === 'notice-list-container') post = noticePosts[index];
        else return;
        
        const imgContainer = document.getElementById('modal-img-container');
        imgContainer.innerHTML = "";
        if (post.images) {
            post.images.forEach(img => imgContainer.innerHTML += `<img src="${img}" style="width:100%; display:block; margin-bottom:5px;">`);
        } else if (post.img) {
            imgContainer.innerHTML = `<img src="${post.img}" style="width:100%; display:block;">`;
        }
        document.getElementById('modal-title').innerText = post.title;
        document.getElementById('modal-date').innerText = post.date;
        document.getElementById('modal-text').innerText = post.body || "";
        document.getElementById('article-modal').style.display = 'block';
    }
    function closeModal(e) { if(e.target.id === 'article-modal' || e.target.classList.contains('modal-close-btn')) document.getElementById('article-modal').style.display = 'none'; }

    /* --- 3. 달력 기능 --- */
    const year = 2026; 
    const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"]; 
    let currentIdx = 0;

    function initCalendar() {
        const c = document.getElementById('calendar-body'); if(!c) return;
        let h = '';
        for (let m=0; m<12; m++) {
            const f = new Date(year, m, 1).getDay(); const l = new Date(year, m+1, 0).getDate();
            h += `<div class="calendar-grid ${m===0?'active-month':''}" id="month-${m}">`;
            for(let i=0; i<f; i++) h+=`<div class="day-cell"></div>`;
            for(let d=1; d<=l; d++) {
                const k = `${m+1}-${d}`; const ev = (typeof mySchedule !== 'undefined') ? mySchedule[k] : null;
                if(ev) h += `<div class="day-cell has-event"><a href="${ev.link}" target="_blank" class="event-link"><span class="day-num">${d}</span><img src="${ev.img}" class="event-img"></a></div>`;
                else h += `<div class="day-cell"><span class="day-num">${d}</span></div>`;
            }
            h += `</div>`;
        } 
        c.innerHTML = h;
    }
    function changeMonth(s) {
        document.getElementById(`month-${currentIdx}`).classList.remove('active-month');
        currentIdx += s; if(currentIdx>11) currentIdx=0; if(currentIdx<0) currentIdx=11;
        document.getElementById(`month-${currentIdx}`).classList.add('active-month');
        document.getElementById('current-month-title').innerHTML = `${monthNames[currentIdx]}<br>${year}`;
    }

    /* --- 4. 초기화 및 무한 로딩 방지 --- */
    function forceHideLoader() {
        const l = document.getElementById('loading-screen');
        if(l) { l.style.opacity = '0'; setTimeout(() => l.style.display = 'none', 800); }
    }

    function handleRouting() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        const target = document.getElementById('page-' + hash); if(target) target.classList.add('active');
        document.querySelectorAll('.nav-menu a').forEach(el => el.classList.remove('active'));
        const link = document.querySelector(`.nav-menu a[href="#${hash}"]`); if(link) link.classList.add('active');
        window.scrollTo(0,0);
    }

    document.addEventListener("DOMContentLoaded", () => {
        try {
            renderList(typeof chekiPosts !== 'undefined' ? chekiPosts : [], 'cheki-list-container', 'card');
            renderList(typeof mediaPosts !== 'undefined' ? mediaPosts : [], 'media-list-container', 'link');
            renderList(typeof noticePosts !== 'undefined' ? noticePosts : [], 'notice-list-container', 'notice');
            initCalendar();
            handleRouting();
        } catch(e) { console.error(e); }
        finally { setTimeout(forceHideLoader, 1500); }
    });
    window.addEventListener('hashchange', handleRouting);
    const lenis = new Lenis({duration:1.2,easing:(t)=>Math.min(1,1.001-Math.pow(2,-10*t)),smooth:true});
    function raf(t){lenis.raf(t);requestAnimationFrame(raf);}requestAnimationFrame(raf);
</script>
</body>
</html>
