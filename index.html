<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSID KAREN ARCHIVE</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
</head>

<body>
<!-- 기존 HTML 구조 동일 -->

<!-- 더미 데이터 (수정됨) -->
<script>
const chekiPosts = [
    {title:"첫 CHEKI", date:"2026.01.18", img:"https://via.placeholder.com/300x400/a855f7/fff?text=CHEKI"}
];
const mediaPosts = [
    {title:"최신 영상", date:"2026.01.18", link:"https://youtube.com", img:"https://via.placeholder.com/300x200/a855f7/fff?text=MEDIA"},
    {title:"포토 업데이트", date:"2026.01.15", link:"https://instagram.com", img:"https://via.placeholder.com/300x200/a855f7/fff?text=PHOTO"}
];
const noticePosts = [
    {title:"사이트 오픈!", date:"2026.01.18", body:"OBSID KAREN ARCHIVE가 시작되었습니다."}
];

// 🔧 PC/Mobile 캘린더 완전 수정
const mySchedule = {
    "01-18": {link:"https://x.com/Obsid_ofcl", img:"https://via.placeholder.com/50/a855f7/fff?text=18", title:"공식 X 업데이트"},
    "01-20": {link:"https://youtube.com", img:"https://via.placeholder.com/50/a855f7/fff?text=20", title:"새 영상 공개"}
};
</script>

<script>
// 🔧 1. 모달 함수 완전 수정 (PC 링크 문제 해결)
function openModal(containerId, index) {
    let posts, post;
    if(containerId === 'cheki-list-container') { posts = chekiPosts; }
    else if(containerId === 'notice-list-container') { posts = noticePosts; }
    else if(containerId === 'media-list-container') { posts = mediaPosts; }
    else return;
    
    post = posts[index];
    if(!post) return;
    
    const imgContainer = document.getElementById('modal-img-container');
    imgContainer.innerHTML = '';
    
    // 이미지 처리
    if(post.images && Array.isArray(post.images)) {
        post.images.forEach(img => {
            imgContainer.innerHTML += `<img src="${img}" class="modal-img" style="width:100%;height:auto;">`;
        });
    } else if(post.img) {
        imgContainer.innerHTML = `<img src="${post.img}" class="modal-img">`;
    }
    
    document.getElementById('modal-title').textContent = post.title;
    document.getElementById('modal-date').textContent = post.date;
    document.getElementById('modal-text').textContent = post.body || '';
    document.getElementById('article-modal').style.display = 'block';
}

// 🔧 2. 달력 완전 재구성 (PC/Mobile 모두 수정)
const year = 2026;
const monthNames = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
let currentMonth = 0;

function initCalendar() {
    const container = document.getElementById('calendar-body');
    if(!container) return;
    
    let html = '';
    for(let m = 0; m < 12; m++) {
        const firstDay = new Date(year, m, 1).getDay();
        const daysInMonth = new Date(year, m + 1, 0).getDate();
        
        html += `<div class="calendar-grid ${(m === 0) ? 'active-month' : ''}" id="month-${m}" style="display: ${m === 0 ? 'grid' : 'none'};">`;
        
        // 빈 날짜 셀
        for(let i = 0; i < firstDay; i++) {
            html += `<div class="day-cell"></div>`;
        }
        
        // 실제 날짜 셀
        for(let day = 1; day <= daysInMonth; day++) {
            const dateKey = `${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const eventData = mySchedule[dateKey];
            
            if(eventData) {
                html += `
                    <div class="day-cell has-event" style="cursor:pointer;">
                        <a href="${eventData.link}" target="_blank" class="event-link" title="${eventData.title || ''}">
                            <span class="day-num">${day}</span>
                            <img src="${eventData.img}" class="event-img" onerror="this.style.display='none'">
                        </a>
                    </div>
                `;
            } else {
                html += `
                    <div class="day-cell">
                        <span class="day-num">${day}</span>
                    </div>
                `;
            }
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

function changeMonth(direction) {
    const currentGrid = document.getElementById(`month-${currentMonth}`);
    currentGrid.classList.remove('active-month');
    currentGrid.style.display = 'none';
    
    currentMonth = (currentMonth + direction + 12) % 12;
    const nextGrid = document.getElementById(`month-${currentMonth}`);
    nextGrid.classList.add('active-month');
    nextGrid.style.display = 'grid';
    
    document.getElementById('current-month-title').innerHTML = `${monthNames[currentMonth]}<br>${year}`;
}

// 🔧 3. 리스트 렌더링 수정
function renderList(data, containerId, type = 'card') {
    const container = document.getElementById(containerId);
    if(!container) return;
    
    if(!data || !data.length) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:#888;">콘텐츠 준비중입니다.</div>';
        return;
    }
    
    let html = '';
    data.forEach((post, index) => {
        const thumb = post.images?.[0] || post.img || '';
        
        if(type === 'link') {
            html += `
                <a href="${post.link || '#'}" target="_blank" class="post-item">
                    <div class="thumb">
                        <img src="${thumb}" onerror="this.src='https://via.placeholder.com/300x200/333/999?text=IMAGE'">
                    </div>
                    <div class="text-box">
                        <span class="category-label">${post.tag || 'MEDIA'}</span>
                        <h3 class="title">${post.title}</h3>
                        <span class="date">${post.date}</span>
                    </div>
                </a>
            `;
        } else if(type === 'notice') {
            html += `
                <div class="notice-item" onclick="openModal('notice-list-container', ${index})" style="cursor:pointer;">
                    <div class="notice-title">${post.title}</div>
                    <div class="notice-date">${post.date}</div>
                </div>
            `;
        } else {
            html += `
                <div class="post-item" onclick="openModal('${containerId}', ${index})" style="cursor:pointer;">
                    <div class="thumb">
                        <img src="${thumb}" onerror="this.src='https://via.placeholder.com/300x400/333/999?text=CHEKI'">
                    </div>
                    <div class="text-box">
                        <span class="category-label">${post.tag || 'CHEKI'}</span>
                        <h3 class="title">${post.title}</h3>
                        <span class="date">${post.date}</span>
                    </div>
                </div>
            `;
        }
    });
    container.innerHTML = html;
}

function closeModal(event) {
    if(event.target.id === 'article-modal' || event.target.classList.contains('modal-close-btn')) {
        document.getElementById('article-modal').style.display = 'none';
    }
}

function handleRouting() {
    const hash = location.hash.replace('#', '') || 'home';
    document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(`page-${hash}`);
    if(target) target.classList.add('active');
    window.scrollTo(0, 0);
}

function forceHideLoader() {
    const loader = document.getElementById('loading-screen');
    if(loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 800);
    }
}

// 초기화
document.addEventListener('DOMContentLoaded', () => {
    renderList(mediaPosts, 'media-list-container', 'link');
    renderList(chekiPosts, 'cheki-list-container');
    renderList(noticePosts, 'notice-list-container', 'notice');
    initCalendar();
    handleRouting();
    setTimeout(forceHideLoader, 1500);
});

window.addEventListener('hashchange', handleRouting);

// Lenis 스무스 스크롤
const lenis = new Lenis({duration:1.2, easing:(t)=>Math.min(1,1.001-Math.pow(2,-10*t)), smooth:true});
function raf(t){lenis.raf(t);requestAnimationFrame(raf);}requestAnimationFrame(raf);
</script>
