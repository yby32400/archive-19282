<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ase's World</title>
    <link href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">ASE.LOG</div>
        
        <nav class="pc-nav">
            <button onclick="loadPost('posts/intro.md')">PROFILE</button>
            <button onclick="loadPost('posts/diary.md')">DIARY</button>
            <button onclick="loadPost('posts/hobby.md')">HOBBY</button>
        </nav>

        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <button onclick="loadPost('posts/intro.md'); toggleMenu()">PROFILE</button>
        <button onclick="loadPost('posts/diary.md'); toggleMenu()">DIARY</button>
        <button onclick="loadPost('posts/hobby.md'); toggleMenu()">HOBBY</button>
        <button onclick="toggleMenu()" class="close-btn">CLOSE X</button>
    </div>

    <main id="content-area" class="fade-in">
        <div class="loading">Loading...</div>
    </main>

    <script>
        // 1. 마크다운 불러오기 함수 (부드러운 전환 포함)
        function loadPost(filename) {
            const contentArea = document.getElementById('content-area');
            
            // 페이드 아웃 (사라짐)
            contentArea.classList.remove('active');
            
            setTimeout(() => {
                fetch(filename)
                    .then(res => {
                        if (!res.ok) throw new Error("404 Not Found");
                        return res.text();
                    })
                    .then(text => {
                        contentArea.innerHTML = marked.parse(text);
                        // 페이드 인 (나타남)
                        contentArea.classList.add('active');
                        window.scrollTo({ top: 0, behavior: 'smooth' }); // 스크롤 맨 위로
                    })
                    .catch(() => {
                        contentArea.innerHTML = "<h1>텅 비었습니다.</h1><p>아직 기록된 게 없네요!</p>";
                        contentArea.classList.add('active');
                    });
            }, 300); // 0.3초 뒤에 내용 교체 (애니메이션 시간과 맞춤)
        }

        // 2. 모바일 메뉴 토글
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('open');
        }

        // 초기 실행
        loadPost('posts/intro.md');
    </script>
</body>
</html>
