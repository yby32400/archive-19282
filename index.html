<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSID KAREN ARCHIVE</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
</head>
<body>

<div id="loading-screen">
    <div class="loading-logo">OBSID ARCHIVE</div>
    <div class="loading-text">SYSTEM INITIALIZING...</div>
</div>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <button class="m-menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-menu" id="mobileMenu">
            <a href="#sns" onclick="toggleMenu()">SNS</a>
            <a href="#notice" onclick="toggleMenu()">NOTICE</a>
            <a href="#cheki" onclick="toggleMenu()">CHEKI</a>
            <a href="#guestbook" onclick="toggleMenu()">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <header class="hero-section">
        <div class="video-frame neon-box">
            <iframe src="https://drive.google.com/file/d/1-ZyXQgAyqs2yzi3NlkEok81UKe7pKP1T/preview" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="hero-content">
            <h2 class="main-copy neon-text">OBSID KAREN<br>ARCHIVE</h2>
            <span class="scroll-down" onclick="document.getElementById('anchor-schedule').scrollIntoView({behavior:'smooth'})">▼ SCROLL DOWN</span>
        </div>
    </header>
    <main class="container">
        <div id="anchor-schedule" class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">OFFICIAL SCHEDULE</h2><p>2026 CALENDAR</p></div>
            <div class="schedule-wrapper">
                <div class="calendar-header">
                    <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                    <h2 id="current-month-title" class="month-title">JANUARY<br>2026</h2>
                    <button class="nav-btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div id="calendar-body"></div>
            </div>
        </div>
        <div class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">LATEST MEDIA</h2><p>VIDEO & PHOTO</p></div>
            <div class="list-wrap" id="media-list-container"></div>
        </div>
    </main>
</div>

<div id="page-sns" class="page-section">
    <main class="container">
        <div class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">OFFICIAL SNS</h2><p>REALTIME FEED</p></div>
            <div class="neon-box twitter-container">
                <a class="twitter-timeline" data-theme="dark" data-height="800" href="https://twitter.com/Official_Obsid">Tweets</a>
                <script async src="https://platform.twitter.com/widgets.js"></script>
            </div>
            <div class="back-btn-wrap"><a href="#home" class="neon-box back-btn">BACK TO HOME</a></div>
        </div>
    </main>
</div>

<div id="page-notice" class="page-section">
    <main class="container"><div class="content-section"><div class="section-header"><h2 class="neon-text-sub">NOTICE</h2></div><div class="notice-list" id="notice-list-container"></div></div></main>
</div>

<div id="page-cheki" class="page-section">
    <main class="container"><div class="content-section"><div class="section-header"><h2 class="neon-text-sub">CHEKI LOG</h2></div><div class="list-wrap" id="cheki-list-container"></div></div></main>
</div>

<div id="page-guestbook" class="page-section">
    <main class="container"><div class="content-section"><div class="section-header"><h2 class="neon-text-sub">GUESTBOOK</h2></div><div class="cbox-wrapper">준비 중입니다.</div></div></main>
</div>

<div id="article-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeModal(event)">×</button>
        <div id="modal-img-container"></div>
        <div class="modal-body">
            <h2 id="modal-title"></h2>
            <span id="modal-date"></span>
            <p id="modal-text"></p>
        </div>
    </div>
</div>

<script src="./data.js"></script>
<script>
    // 1. 리스트 그리기
    function renderList(data, id, type) {
        const c = document.getElementById(id); if(!c || !data) return;
        let h = "";
        data.forEach((p, i) => {
            let thumb = Array.isArray(p.images) && p.images.length > 0 ? p.images[0] : (p.img || "");
            if(type === 'link') {
                h += `<a href="${p.link||'#'}" target="_blank" class="post-item"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><span class="category-label">${p.tag}</span><h3 class="title">${p.title}</h3><span class="date">${p.date}</span></div></a>`;
            } else {
                h += `<div class="post-item" onclick="openModal('${id}', ${i})"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><span class="category-label">${p.tag}</span><h3 class="title">${p.title}</h3><span class="date">${p.date}</span></div></div>`;
            }
        });
        c.innerHTML = h;
    }

    // 2. 모달 기능
    function openModal(type, index) {
        let post = type === 'cheki-list-container' ? chekiPosts[index] : noticePosts[index];
        const imgContainer = document.getElementById('modal-img-container');
        imgContainer.innerHTML = "";
        if (Array.isArray(post.images)) post.images.forEach(img => imgContainer.innerHTML += `<img src="${img}" style="width:100%;">`);
        else if (post.img) imgContainer.innerHTML = `<img src="${post.img}" style="width:100%;">`;
        document.getElementById('modal-title').innerText = post.title;
        document.getElementById('modal-date').innerText = post.date;
        document.getElementById('modal-text').innerText = post.body;
        document.getElementById('article-modal').style.display = 'block';
    }
    function closeModal(e) { if(e.target.id === 'article-modal' || e.target.classList.contains('modal-close-btn')) document.getElementById('article-modal').style.display = 'none'; }

    // 3. 메뉴 및 라우팅
    function toggleMenu() {
        document.getElementById('mobileMenu').classList.toggle('active');
        document.querySelector('.m-menu-btn').classList.toggle('active');
    }
    function handleRouting() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        const target = document.getElementById('page-' + hash);
        if(target) target.classList.add('active');
        window.scrollTo(0,0);
    }
    window.addEventListener('hashchange', handleRouting);

    // 4. 달력
    const year = 2026; let currentIdx = 0;
    const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    function initCalendar() {
        const c = document.getElementById('calendar-body'); if(!c) return;
        let h = '';
        for (let m=0; m<12; m++) {
            const f = new Date(year, m, 1).getDay(); const l = new Date(year, m+1, 0).getDate();
            h += `<div class="calendar-grid ${m===0?'active-month':''}" id="month-${m}">`;
            for(let i=0; i<f; i++) h+=`<div class="day-cell"></div>`;
            for(let d=1; d<=l; d++) {
                const k = `${m+1}-${d}`; const ev = mySchedule[k];
                h += ev ? `<div class="day-cell has-event"><a href="${ev.link}" target="_blank"><span class="day-num">${d}</span><img src="${ev.img}" class="event-img"></a></div>` : `<div class="day-cell"><span class="day-num">${d}</span></div>`;
            }
            h += `</div>`;
        }
        c.innerHTML = h;
    }
    function changeMonth(s) {
        document.getElementById(`month-${currentIdx}`).classList.remove('active-month');
        currentIdx = (currentIdx + s + 12) % 12;
        document.getElementById(`month-${currentIdx}`).classList.add('active-month');
        document.getElementById('current-month-title').innerHTML = `${monthNames[currentIdx]}<br>${year}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderList(typeof chekiPosts !== 'undefined' ? chekiPosts : [], 'cheki-list-container', 'card');
        renderList(typeof mediaPosts !== 'undefined' ? mediaPosts : [], 'media-list-container', 'link');
        renderList(typeof noticePosts !== 'undefined' ? noticePosts : [], 'notice-list-container', 'notice');
        initCalendar(); handleRouting();
        setTimeout(() => { const l=document.getElementById('loading-screen'); if(l){l.style.opacity='0'; setTimeout(()=>l.style.display='none',800);} }, 1500);
    });
</script>
</body>
</html>
