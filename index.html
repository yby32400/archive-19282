<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSID KAREN ARCHIVE</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

<style>
/* [개발자 노트] 기존 네온 스타일을 유지하며 가로 꽉 찬 배너 스타일만 추가했습니다. */
.content-section-full {
    width: 100vw; position: relative;
    left: 50%; right: 50%;
    margin-left: -50vw; margin-right: -50vw;
    margin-top: 80px; margin-bottom: 50px;
}
.official-banner-link { display: block; width: 100%; overflow: hidden; position: relative; }
.banner-wrapper-full { position: relative; width: 100%; overflow: hidden; line-height: 0; border-top: 1px solid rgba(168, 85, 247, 0.4); border-bottom: 1px solid rgba(168, 85, 247, 0.4); }
.banner-img { width: 100%; height: auto; object-fit: cover; transition: 0.5s ease; filter: brightness(0.8); }
.banner-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(168, 85, 247, 0.3); display: flex; 
    justify-content: center; align-items: center; opacity: 0; transition: 0.5s ease;
}
.banner-overlay span {
    color: #fff; font-weight: 900; font-size: 1.5rem; text-shadow: 0 0 15px #a855f7;
    border: 2px solid #fff; padding: 15px 35px; border-radius: 50px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    transform: translateY(20px); transition: transform 0.5s ease;
}
.official-banner-link:hover .banner-img { filter: blur(8px) brightness(0.6); transform: scale(1.05); }
.official-banner-link:hover .banner-overlay { opacity: 1; }
.official-banner-link:hover .banner-overlay span { transform: translateY(0); }
</style>
</head>

<body>

<div id="loading-screen">
    <div class="loading-logo">OBSID ARCHIVE</div>
    <div class="loading-text">SYSTEM INITIALIZING...</div>
</div>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <div class="nav-menu">
            <a href="#notice">NOTICE</a>
            <a href="#cheki">CHEKI</a>
            <a href="#guestbook">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <header class="hero-section">
        <div class="video-frame neon-box">
            <iframe src="https://drive.google.com/file/d/1-ZyXQgAyqs2yzi3NlkEok81UKe7pKP1T/preview" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="hero-content">
            <p class="d-day neon-text-sub">TODAY'S MOOD</p>
            <h2 class="main-copy neon-text">OBSID KAREN<br>ARCHIVE</h2>
            <span class="scroll-down" onclick="document.getElementById('anchor-schedule').scrollIntoView({behavior:'smooth'})">▼ SCROLL DOWN</span>
        </div>
    </header>
    <main class="container">
        <div id="anchor-schedule" class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">OFFICIAL SCHEDULE</h2><p>2026 CALENDAR</p></div>
            <div class="schedule-wrapper">
                <div class="calendar-header">
                    <button type="button" class="nav-btn" onclick="changeMonth(-1)">◀</button>
                    <h2 id="current-month-title" class="month-title">JANUARY<br>2026</h2>
                    <button type="button" class="nav-btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div id="calendar-body"></div>
            </div>
        </div>
        
        <div class="content-section-full">
            <div class="section-header" style="text-align:center;"><h2 class="neon-text-sub">OFFICIAL X</h2><p>REALTIME FEED</p></div>
            <a href="https://x.com/Obsid_ofcl" target="_blank" class="official-banner-link">
                <div class="banner-wrapper-full">
                    <img src="https://pbs.twimg.com/profile_banners/1965985666375819264/1762981893/1080x360" class="banner-img">
                    <div class="banner-overlay"><span>옵시드 공식 X 바로가기</span></div>
                </div>
            </a>
        </div>

        <div class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">LATEST MEDIA</h2><p>VIDEO & PHOTO</p></div>
            <div class="list-wrap" id="media-list-container"></div>
        </div>
    </main>
</div>

<script src="./data.js"></script>
<script>
    /* [개발자 노트] 무한 로딩 방지를 위해 try-finally 구조를 적용했습니다. */
    function forceHideLoader() {
        const loader = document.getElementById('loading-screen');
        if(loader) {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 800);
        }
    }

    // 기존 renderList, openModal, closeModal 함수는 작성자님 코드를 그대로 사용하되
    // 에러 방지 로직을 추가했습니다.
    function renderList(data, id, type) {
        const c = document.getElementById(id); if(!c) return;
        let h = "";
        if(!data || data.length === 0) return;
        data.forEach((p, i) => {
            let thumb = (p.images && p.images[0]) || p.img || "";
            if(type === 'link') {
                h += `<a href="${p.link||'#'}" target="_blank" class="post-item"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><span class="category-label">${p.tag}</span><h3 class="title">${p.title}</h3><span class="date">${p.date}</span></div></a>`;
            } else if (type === 'notice') {
                h += `<div class="notice-item" onclick="openModal('${id}', ${i})"><div class="notice-title">${p.title}</div><div class="notice-date">${p.date}</div><div class="notice-body-preview">${p.body}</div></div>`;
            } else {
                h += `<div class="post-item" onclick="openModal('${id}', ${i})"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><span class="category-label">${p.tag}</span><h3 class="title">${p.title}</h3><span class="date">${p.date}</span></div></div>`;
            }
        });
        c.innerHTML = h;
    }

    // 초기화 실행부
    document.addEventListener("DOMContentLoaded", () => {
        try {
            renderList(typeof chekiPosts !== 'undefined' ? chekiPosts : [], 'cheki-list-container', 'card');
            renderList(typeof mediaPosts !== 'undefined' ? mediaPosts : [], 'media-list-container', 'link');
            renderList(typeof noticePosts !== 'undefined' ? noticePosts : [], 'notice-list-container', 'notice');
            initCalendar();
            handleRouting();
        } catch(e) {
            console.error("초기화 중 오류 발생:", e);
        } finally {
            // 어떤 에러가 나도 1.5초 뒤엔 무조건 로딩 해제
            setTimeout(forceHideLoader, 1500);
        }
    });

    // ... handleRouting, initCalendar, changeMonth 등 나머지 함수 유지 ...
</script>
</body>
</html>
