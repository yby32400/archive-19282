<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSID KAREN ARCHIVE</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
</head>
<body>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <button class="m-menu-btn" id="menuBtn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-menu" id="mobileMenu">
            <a href="#home" onclick="toggleMenu()">HOME</a>
            <a href="#sns" onclick="toggleMenu()">SNS</a>
            <a href="#notice" onclick="toggleMenu()">NOTICE</a>
            <a href="#cheki" onclick="toggleMenu()">CHEKI</a>
            <a href="#guestbook" onclick="toggleMenu()">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <main class="container">
        <header class="hero-section">
            <div class="video-frame neon-box">
                <iframe src="https://drive.google.com/file/d/1-ZyXQgAyqs2yzi3NlkEok81UKe7pKP1T/preview" frameborder="0" style="width:100%; height:100%;" allowfullscreen></iframe>
            </div>
            <p class="neon-text-sub" style="margin-bottom:10px;">TODAY'S MOOD</p>
            <h2 class="neon-text" style="font-size: 2.5rem; line-height:1.2;">OBSID KAREN<br>ARCHIVE</h2>
        </header>

        <section class="content-section">
            <h2 class="neon-text-sub">OFFICIAL SCHEDULE</h2>
            <p style="color:#666; font-size:12px; margin-bottom:20px;">2026 CALENDAR</p>
            <div class="calendar-header" style="display:flex; align-items:center; gap:30px; margin-bottom:20px;">
                <button onclick="changeMonth(-1)" style="background:none; border:1px solid #a855f7; color:#fff; width:30px; height:30px; border-radius:50%;">◀</button>
                <h2 id="current-month-title" style="font-size:20px; font-weight:800;">JANUARY 2026</h2>
                <button onclick="changeMonth(1)" style="background:none; border:1px solid #a855f7; color:#fff; width:30px; height:30px; border-radius:50%;">▶</button>
            </div>
            <div id="calendar-body"></div>
        </section>

        <section class="content-section">
            <h2 class="neon-text-sub" style="margin-bottom:30px;">LATEST MEDIA</h2>
            <div class="list-wrap" id="media-list-container"></div>
        </section>
    </main>
</div>

<div id="page-sns" class="page-section">
    <main class="container">
        <h2 class="neon-text-sub" style="margin-bottom:40px;">OFFICIAL SNS</h2>
        <div class="neon-box" style="width:100%; max-width:500px; overflow:hidden;">
            <a class="twitter-timeline" data-theme="dark" data-height="600" href="https://twitter.com/Official_Obsid">Tweets</a>
            <script async src="https://platform.twitter.com/widgets.js"></script>
        </div>
    </main>
</div>

<script src="./data.js"></script>
<script>
    // 햄버거 메뉴 토글 (X버튼 애니메이션 포함)
    function toggleMenu() {
        const menu = document.getElementById('mobileMenu');
        const btn = document.getElementById('menuBtn');
        menu.classList.toggle('active');
        btn.classList.toggle('active'); // CSS에서 .m-menu-btn.active가 작동하게 함
    }

    // 페이지 라우팅
    function handleRouting() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('page-' + hash);
        if(target) target.classList.add('active');
        window.scrollTo(0,0);
    }
    window.addEventListener('hashchange', handleRouting);

    // 달력 및 리스트 로직 (생략 없이 이전과 동일하게 유지)
    // ... (renderList, initCalendar 함수 등)
</script>
</body>
</html>
