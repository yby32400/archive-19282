<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSID KAREN ARCHIVE</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
</head>
<body>

<div id="loading-screen">
    <div class="loading-logo">OBSID ARCHIVE</div>
    <div class="loading-text">SYSTEM INITIALIZING...</div>
</div>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        
        <button class="m-menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>

        <div class="nav-menu" id="mobileMenu">
            <a href="#home" onclick="toggleMenu()">HOME</a>
            <a href="#sns" onclick="toggleMenu()">SNS</a>
            <a href="#notice" onclick="toggleMenu()">NOTICE</a>
            <a href="#cheki" onclick="toggleMenu()">CHEKI</a>
            <a href="#guestbook" onclick="toggleMenu()">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <header class="hero-section">
        <div class="video-frame neon-box">
            <iframe src="https://drive.google.com/file/d/1-ZyXQgAyqs2yzi3NlkEok81UKe7pKP1T/preview" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="hero-content">
            <p class="neon-text-sub">TODAY'S MOOD</p>
            <h2 class="main-copy neon-text">OBSID KAREN<br>ARCHIVE</h2>
            <div class="scroll-down" onclick="document.getElementById('anchor-schedule').scrollIntoView({behavior:'smooth'})">▼ SCROLL DOWN</div>
        </div>
    </header>
    <main class="container">
        <section id="anchor-schedule" class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">OFFICIAL SCHEDULE</h2><p>2026 CALENDAR</p></div>
            <div class="schedule-wrapper">
                <div class="calendar-header">
                    <button class="nav-btn neon-box" onclick="changeMonth(-1)">◀</button>
                    <h2 id="current-month-title" class="month-title">JANUARY 2026</h2>
                    <button class="nav-btn neon-box" onclick="changeMonth(1)">▶</button>
                </div>
                <div id="calendar-body"></div>
            </div>
        </section>
        <section class="content-section">
            <div class="section-header"><h2 class="neon-text-sub">LATEST MEDIA</h2></div>
            <div class="list-wrap" id="media-list-container"></div>
        </section>
    </main>
</div>

<div id="page-sns" class="page-section">
    <main class="container">
        <div class="section-header"><h2 class="neon-text-sub">OFFICIAL SNS</h2></div>
        <div class="neon-box twitter-wrapper" style="max-width:500px; margin:0 auto; border-radius:15px; overflow:hidden;">
            <a class="twitter-timeline" data-theme="dark" data-height="600" href="https://twitter.com/Official_Obsid">Tweets by Official_Obsid</a>
            <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
        </div>
    </main>
</div>

<div id="page-notice" class="page-section">
    <main class="container">
        <div class="section-header"><h2 class="neon-text-sub">NOTICE</h2></div>
        <div class="notice-list" id="notice-list-container"></div>
    </main>
</div>

<div id="page-cheki" class="page-section">
    <main class="container">
        <div class="section-header"><h2 class="neon-text-sub">CHEKI LOG</h2></div>
        <div class="list-wrap" id="cheki-list-container"></div>
    </main>
</div>

<div id="page-guestbook" class="page-section">
    <main class="container">
        <div class="section-header"><h2 class="neon-text-sub">GUESTBOOK</h2></div>
        <div class="cbox-wrapper" style="text-align:center; padding:50px; color:#666;">준비 중입니다.</div>
    </main>
</div>

<div id="article-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content">
        <button class="modal-close-btn" onclick="closeModal(event)">×</button>
        <div id="modal-img-container"></div>
        <div class="modal-body">
            <h2 id="modal-title" class="modal-title"></h2>
            <span id="modal-date" class="modal-date"></span>
            <p id="modal-text" class="modal-text"></p>
        </div>
    </div>
</div>

<script src="./data.js"></script>
<script>
    // 1. 공통 리스트 렌더링 함수
    function renderList(data, id, type) {
        const container = document.getElementById(id); if(!container || !data) return;
        let html = "";
        data.forEach((item, index) => {
            let thumb = Array.isArray(item.images) && item.images.length > 0 ? item.images[0] : (item.img || "");
            if(type === 'link') {
                html += `<a href="${item.link||'#'}" target="_blank" class="post-item"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><span class="category-label">${item.tag}</span><h3 class="title">${item.title}</h3><span class="date">${item.date}</span></div></a>`;
            } else if (type === 'notice') {
                html += `<div class="notice-item" onclick="openModal('${id}', ${index})"><div class="notice-title">${item.title}</div><div class="notice-date">${item.date}</div><div class="notice-body-preview">${item.body}</div></div>`;
            } else {
                html += `<div class="post-item" onclick="openModal('${id}', ${index})"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><span class="category-label">${item.tag}</span><h3 class="title">${item.title}</h3><span class="date">${item.date}</span></div></div>`;
            }
        });
        container.innerHTML = html;
    }

    // 2. 모달 열기/닫기
    function openModal(type, index) {
        let post;
        if(type === 'cheki-list-container') post = chekiPosts[index];
        else if(type === 'notice-list-container') post = noticePosts[index];
        else return;

        const imgContainer = document.getElementById('modal-img-container');
        imgContainer.innerHTML = "";
        if (Array.isArray(post.images)) {
            post.images.forEach(img => imgContainer.innerHTML += `<img src="${img}" style="width:100%; display:block; margin-bottom:5px;">`);
        } else if (post.img) {
            imgContainer.innerHTML = `<img src="${post.img}" style="width:100%; display:block;">`;
        }
        document.getElementById('modal-title').innerText = post.title;
        document.getElementById('modal-date').innerText = post.date;
        document.getElementById('modal-text').innerText = post.body;
        document.getElementById('article-modal').style.display = 'block';
    }
    function closeModal(e) { if(e.target.id === 'article-modal' || e.target.classList.contains('modal-close-btn')) document.getElementById('article-modal').style.display = 'none'; }

    // 3. 햄버거 메뉴 토글
    function toggleMenu() {
        document.getElementById('mobileMenu').classList.toggle('active');
        document.querySelector('.m-menu-btn').classList.toggle('active');
    }

    // 4. 페이지 이동 (해시 라우팅)
    function handleRouting() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        const target = document.getElementById('page-' + hash);
        if(target) target.classList.add('active');
        
        document.querySelectorAll('.nav-menu a').forEach(el => el.classList.remove('active'));
        const activeLink = document.querySelector(`.nav-menu a[href="#${hash}"]`);
        if(activeLink) activeLink.classList.add('active');
        window.scrollTo(0,0);
    }
    window.addEventListener('hashchange', handleRouting);

    // 5. 달력 시스템
    const year = 2026;
    const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    let currentMonthIdx = 0;

    function initCalendar() {
        const body = document.getElementById('calendar-body'); if(!body || typeof mySchedule === 'undefined') return;
        let html = '';
        for (let m=0; m<12; m++) {
            const firstDay = new Date(year, m, 1).getDay();
            const lastDate = new Date(year, m+1, 0).getDate();
            html += `<div class="calendar-grid ${m===0?'active-month':''}" id="month-${m}">`;
            for(let i=0; i<firstDay; i++) html += `<div class="day-cell"></div>`;
            for(let d=1; d<=lastDate; d++) {
                const key = `${m+1}-${d}`;
                const event = mySchedule[key];
                html += event ? `<div class="day-cell has-event"><a href="${event.link}" target="_blank"><span class="day-num">${d}</span><img src="${event.img}" class="event-img"></a></div>` : `<div class="day-cell"><span class="day-num">${d}</span></div>`;
            }
            html += `</div>`;
        }
        body.innerHTML = html;
    }

    function changeMonth(step) {
        document.getElementById(`month-${currentMonthIdx}`).classList.remove('active-month');
        currentMonthIdx = (currentMonthIdx + step + 12) % 12;
        document.getElementById(`month-${currentMonthIdx}`).classList.add('active-month');
        document.getElementById('current-month-title').innerHTML = `${monthNames[currentMonthIdx]}<br>${year}`;
    }

    // 6. 초기 로딩 및 실행
    document.addEventListener("DOMContentLoaded", () => {
        initCalendar();
        handleRouting();
        renderList(typeof mediaPosts !== 'undefined' ? mediaPosts : [], 'media-list-container', 'link');
        renderList(typeof noticePosts !== 'undefined' ? noticePosts : [], 'notice-list-container', 'notice');
        renderList(typeof chekiPosts !== 'undefined' ? chekiPosts : [], 'cheki-list-container', 'card');
        
        setTimeout(() => {
            const loader = document.getElementById('loading-screen');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 800);
            }
        }, 1500);
    });

    // Lenis 부드러운 스크롤
    const lenis = new Lenis({duration: 1.2, smooth: true});
    function raf(t){ lenis.raf(t); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);
</script>
</body>
</html>
