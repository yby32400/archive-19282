<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P3R: Moonlight Link</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-peak/SUIT/fonts/variable/suit-variable.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="p3r-wrapper">
        
        <div class="p3r-stage">
            <div class="p3r-stage__bg"></div>
            <div class="p3r-stage__particles">
                </div>
        </div>

        <div class="p3r-character">
            <div class="p3r-character__main"></div>
        </div>

        <nav class="p3r-nav">
            <ul class="p3r-nav__list">
                <li class="p3r-nav__item" data-target="status">STATUS</li>
                <li class="p3r-nav__item" data-target="calendar">CALENDAR</li>
                <li class="p3r-nav__item" data-target="commu">COMMU</li>
                <li class="p3r-nav__item" data-target="equip">EQUIP</li>
                <li class="p3r-nav__item" data-target="skill">SKILL</li>
            </ul>
        </nav>

        <section class="p3r-hud">
            <header class="p3r-hud__header">
                <div class="p3r-hud__date">0000 / 00 / 00</div>
                <div class="p3r-hud__location">TATSUMI PORT ISLAND</div>
            </header>

            <div id="app-content" class="p3r-content">
                </div>
        </section>

        <div class="p3r-fx__slash"></div>

    </main>

    <script src="script.js"></script>
</body>
</html>
