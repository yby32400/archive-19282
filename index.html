<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>P3R Moonlight Link</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="p3r-stage">

        <!-- 배경 레이어 (수중/빛 겹침) -->
        <div class="p3r-bg-layer"></div>
        <div class="p3r-bg-layer p3r-bg-layer--alt"></div>

        <!-- HUD -->
        <div class="p3r-hud">
            <div class="p3r-hud__label">NAME</div>
            <div class="p3r-hud__value">아쿠아</div>
            <div class="p3r-hud__label">BIRTH</div>
            <div class="p3r-hud__value">07.16</div>
            <div class="p3r-hud__label">HEIGHT</div>
            <div class="p3r-hud__value">168cm</div>
        </div>

        <!-- SPA 콘텐츠 영역 -->
        <div class="p3r-content">
            <!-- JS로 status/equip/skill 교체 -->
        </div>

        <!-- 내비게이션 -->
        <div class="p3r-nav">
            <div class="p3r-nav__item p3r-nav__item--active" data-section="status">STATUS</div>
            <div class="p3r-nav__item" data-section="equip">EQUIP</div>
            <div class="p3r-nav__item" data-section="skill">SKILL</div>
        </div>

        <!-- FX 레이어 (Slash, Cut-in 등) -->
        <div class="p3r-fx"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
