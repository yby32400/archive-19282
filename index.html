<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>P3R Moonlight Link - Main Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="p3r-stage">

        <!-- 배경 레이어 -->
        <div class="p3r-bg-layer"></div>
        <div class="p3r-bg-layer p3r-bg-layer--alt"></div>

        <!-- HUD (메뉴 화면에서는 생략 가능) -->
        <!-- <div class="p3r-hud">...</div> -->

        <!-- 메뉴 버튼 영역 -->
        <div class="p3r-nav p3r-main-menu">
            <div class="p3r-nav__item" data-section="status">STATUS</div>
            <div class="p3r-nav__item" data-section="equip">EQUIP</div>
            <div class="p3r-nav__item" data-section="skill">SKILL</div>
            <div class="p3r-nav__item" data-section="commu">COMMU</div>
            <div class="p3r-nav__item" data-section="calendar">CALENDAR</div>
        </div>

        <!-- FX 레이어 -->
        <div class="p3r-fx"></div>
    </div>
</body>
</html>
