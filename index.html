<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSID KAREN ARCHIVE</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
</head>
<body>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <button class="m-menu-btn" id="menuBtn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-menu" id="mobileMenu">
            <a href="#home" onclick="toggleMenu()">HOME</a>
            <a href="#sns" onclick="toggleMenu()">SNS</a>
            <a href="#notice" onclick="toggleMenu()">NOTICE</a>
            <a href="#cheki" onclick="toggleMenu()">CHEKI</a>
            <a href="#guestbook" onclick="toggleMenu()">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <main class="container">
        <header class="hero-section">
            <div class="video-frame neon-box">
                <iframe src="https://drive.google.com/file/d/1-ZyXQgAyqs2yzi3NlkEok81UKe7pKP1T/preview" frameborder="0" style="width:100%; height:100%;" allowfullscreen></iframe>
            </div>
            <p class="neon-text-sub" style="margin-bottom:10px;">TODAY'S MOOD</p>
            <h2 class="neon-text" style="font-size: 2.5rem; line-height:1.2;">OBSID KAREN<br>ARCHIVE</h2>
        </header>

        <section class="content-section">
            <h2 class="neon-text-sub">OFFICIAL SCHEDULE</h2>
            <p style="color:#666; font-size:12px; margin-bottom:20px;">2026 CALENDAR</p>
            <div class="calendar-header" style="display:flex; align-items:center; gap:30px; margin-bottom:20px; justify-content: center;">
                <button onclick="changeMonth(-1)" style="background:none; border:1px solid #a855f7; color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer;">◀</button>
                <h2 id="current-month-title" style="font-size:20px; font-weight:800; min-width: 150px; text-align: center;">JANUARY 2026</h2>
                <button onclick="changeMonth(1)" style="background:none; border:1px solid #a855f7; color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer;">▶</button>
            </div>
            <div id="calendar-body"></div>
        </section>

        <section class="content-section">
            <h2 class="neon-text-sub" style="margin-bottom:30px;">LATEST MEDIA</h2>
            <div class="list-wrap" id="media-list-container"></div>
        </section>
    </main>
</div>

<div id="page-sns" class="page-section">
    <main class="container">
        <h2 class="neon-text-sub" style="margin-bottom:40px;">OFFICIAL SNS</h2>
        <div class="neon-box" style="width:100%; max-width:500px; overflow:hidden; margin: 0 auto;">
            <a class="twitter-timeline" data-theme="dark" data-height="600" href="https://twitter.com/Official_Obsid">Tweets</a>
            <script async src="https://platform.twitter.com/widgets.js"></script>
        </div>
    </main>
</div>

<div id="page-notice" class="page-section">
    <main class="container">
        <h2 class="neon-text-sub" style="margin-bottom:40px;">NOTICE</h2>
        <div class="notice-list" id="notice-list-container"></div>
    </main>
</div>

<div id="page-cheki" class="page-section">
    <main class="container">
        <h2 class="neon-text-sub" style="margin-bottom:40px;">CHEKI LOG</h2>
        <div class="list-wrap" id="cheki-list-container"></div>
    </main>
</div>

<div id="page-guestbook" class="page-section">
    <main class="container">
        <h2 class="neon-text-sub" style="margin-bottom:40px;">GUESTBOOK</h2>
        <div style="text-align:center; color:#666;">준비 중입니다.</div>
    </main>
</div>

<script src="./data.js"></script>
<script>
    // 1. 햄버거 메뉴 토글
    function toggleMenu() {
        const menu = document.getElementById('mobileMenu');
        const btn = document.getElementById('menuBtn');
        menu.classList.toggle('active');
        btn.classList.toggle('active');
    }

    // 2. 페이지 라우팅 (방 바꾸기)
    function handleRouting() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('page-' + hash);
        if(target) target.classList.add('active');
        window.scrollTo(0,0);
    }
    window.addEventListener('hashchange', handleRouting);

    // 3. 리스트 그리기 함수 (미디어, 공지, 체키 공용)
    function renderList(data, id, type) {
        const c = document.getElementById(id); if(!c || !data) return;
        let h = "";
        data.forEach((p, i) => {
            let thumb = Array.isArray(p.images) && p.images.length > 0 ? p.images[0] : (p.img || "");
            if(type === 'link') {
                h += `<a href="${p.link||'#'}" target="_blank" class="post-item"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><h3>${p.title}</h3><span>${p.date}</span></div></a>`;
            } else {
                h += `<div class="post-item"><div class="thumb"><img src="${thumb}"></div><div class="text-box"><h3>${p.title}</h3><span>${p.date}</span></div></div>`;
            }
        });
        c.innerHTML = h;
    }

    // 4. 달력 로직
    const year = 2026;
    const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    let currentIdx = 0;

    function initCalendar() {
        const c = document.getElementById('calendar-body'); if(!c || typeof mySchedule === 'undefined') return;
        let h = '';
        for (let m=0; m<12; m++) {
            const f = new Date(year, m, 1).getDay(); const l = new Date(year, m+1, 0).getDate();
            h += `<div class="calendar-grid ${m===0?'active-month':''}" id="month-${m}">`;
            for(let i=0; i<f; i++) h += `<div class="day-cell"></div>`;
            for(let d=1; d<=l; d++) {
                const k = `${m+1}-${d}`; const ev = mySchedule[k];
                h += ev ? `<div class="day-cell has-event"><a href="${ev.link}" target="_blank"><span class="day-num">${d}</span><img src="${ev.img}" class="event-img"></a></div>` : `<div class="day-cell"><span class="day-num">${d}</span></div>`;
            }
            h += `</div>`;
        }
        c.innerHTML = h;
    }

    function changeMonth(s) {
        const prevMonth = document.getElementById(`month-${currentIdx}`);
        if(prevMonth) prevMonth.classList.remove('active-month');
        currentIdx = (currentIdx + s + 12) % 12;
        const nextMonth = document.getElementById(`month-${currentIdx}`);
        if(nextMonth) nextMonth.classList.add('active-month');
        document.getElementById('current-month-title').innerHTML = `${monthNames[currentIdx]} ${year}`;
    }

    // 5. 실행 (페이지 로드 시 데이터 뿌리기)
    document.addEventListener("DOMContentLoaded", () => {
        handleRouting();
        initCalendar();
        // data.js에 있는 변수 이름과 맞춰야 합니다.
        if(typeof mediaPosts !== 'undefined') renderList(mediaPosts, 'media-list-container', 'link');
        if(typeof noticePosts !== 'undefined') renderList(noticePosts, 'notice-list-container', 'card');
        if(typeof chekiPosts !== 'undefined') renderList(chekiPosts, 'cheki-list-container', 'card');
    });
</script>
</body>
</html>
