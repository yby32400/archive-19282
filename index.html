<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSID KAREN ARCHIVE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        /* [1] 초기화 및 전체 테마 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #050505; color: #fff; line-height: 1.6; 
            padding-top: 70px; overflow-x: hidden; 
        }
        a { text-decoration: none; color: inherit; cursor: pointer; }

        /* [2] 네온 & 라운딩 효과 */
        .neon-text { color: #fff; text-shadow: 0 0 10px #fff, 0 0 20px #a855f7, 0 0 30px #a855f7; }
        .neon-text-sub { color: #e9d5ff; text-shadow: 0 0 8px #a855f7; font-weight: 700; }
        .neon-box { 
            border: 1px solid rgba(168, 85, 247, 0.5); 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); 
            border-radius: 15px !important; overflow: hidden; 
        }

        /* [3] 상단 네비게이션 및 부드러운 메뉴 */
        .sticky_nav { 
            position: fixed; top: 0; width: 100%; height: 70px; 
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px); 
            z-index: 9999; border-bottom: 1px solid rgba(168, 85, 247, 0.3); 
            display: flex; justify-content: center; align-items: center; 
        }
        .nav-inner { width: 100%; max-width: 1200px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo a { font-weight: 800; font-size: 20px; text-shadow: 0 0 10px #a855f7; }

        .nav-menu { display: flex; gap: 20px; }
        .m-menu-btn { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; z-index: 10001; }
        .m-menu-btn span { width: 25px; height: 3px; background: #a855f7; border-radius: 2px; transition: 0.3s; }

        @media (max-width: 768px) {
            .m-menu-btn { display: flex; }
            .nav-menu {
                position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
                background: rgba(0, 0, 0, 0.98); flex-direction: column; justify-content: center; align-items: center;
                gap: 40px; z-index: 10000;
                /* 부드러운 애니메이션 */
                opacity: 0; visibility: hidden; transform: translateY(-20px); transition: 0.4s ease;
            }
            .nav-menu.active { opacity: 1; visibility: visible; transform: translateY(0); }
            .nav-menu a { font-size: 24px; color: #fff; text-shadow: 0 0 15px #a855f7; }
            .m-menu-btn.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .m-menu-btn.active span:nth-child(2) { opacity: 0; }
            .m-menu-btn.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        }

        /* [4] 부드러운 페이지 전환 */
        .page-section { display: none; width: 100%; min-height: calc(100vh - 70px); }
        .page-section.active { 
            display: block; animation: fadeIn 0.6s ease; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* [5] 모바일 최적화 달력 */
        .calendar-grid { display: none !important; grid-template-columns: repeat(7, 1fr); gap: 8px; width: 100%; max-width: 500px; margin: 0 auto; }
        .calendar-grid.active-month { display: grid !important; }
        .day-cell { position: relative; aspect-ratio: 1 / 1.4; background: #111; border: 1px solid #222; border-radius: 10px; overflow: hidden; }
        .has-event { border: 1px solid #a855f7; }
        .event-img { width: 100%; height: 100%; object-fit: cover; }
        .day-num { position: absolute; top: 5px; left: 5px; font-size: 11px; color: #444; }

        @media (max-width: 768px) {
            /* 모바일에서는 일정이 있는 날만 표시 */
            .day-cell:not(.has-event) { display: none; }
            .calendar-grid { grid-template-columns: repeat(4, 1fr) !important; }
        }

        /* [6] 상세 보기 모달 (팝업) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            z-index: 100002; display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #111; width: 90%; max-width: 500px; max-height: 80vh;
            border-radius: 20px; border: 1px solid #a855f7; padding: 25px;
            overflow-y: auto; position: relative; animation: modalPop 0.3s ease;
        }
        @keyframes modalPop { from { opacity: 0; scale: 0.9; } to { opacity: 1; scale: 1; } }
        .modal-close { position: absolute; top: 15px; right: 15px; font-size: 24px; color: #a855f7; cursor: pointer; }

        /* 공통 컨테이너 */
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .list-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; margin-top: 30px; }
        .post-item { background: #111; border-radius: 15px; border: 1px solid #333; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .post-item:hover { border-color: #a855f7; transform: translateY(-5px); }
        .thumb { width: 100%; aspect-ratio: 16 / 9; background: #222; }
    </style>
</head>
<body>

<nav class="sticky_nav">
    <div class="nav-inner">
        <h1 class="logo neon-text"><a href="#home">MY ARCHIVE</a></h1>
        <button class="m-menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></button>
        <div class="nav-menu" id="mobileMenu">
            <a href="#home" onclick="toggleMenu()">HOME</a>
            <a href="#sns" onclick="toggleMenu()">SNS</a>
            <a href="#notice" onclick="toggleMenu()">NOTICE</a>
            <a href="#cheki" onclick="toggleMenu()">CHEKI</a>
            <a href="#guestbook" onclick="toggleMenu()">GUESTBOOK</a>
        </div>
    </div>
</nav>

<div id="page-home" class="page-section active">
    <main class="container">
        <h2 class="neon-text" style="font-size: 2.5rem; margin-bottom: 50px;">OBSID KAREN ARCHIVE</h2>
        <section class="content-section">
            <h2 class="neon-text-sub" style="margin-bottom:20px;">OFFICIAL SCHEDULE</h2>
            <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
                <button onclick="changeMonth(-1)" style="background:none; border:1px solid #a855f7; color:#fff; width:35px; border-radius:50%;">◀</button>
                <h2 id="current-month-title" class="neon-text" style="min-width:160px;">JANUARY 2026</h2>
                <button onclick="changeMonth(1)" style="background:none; border:1px solid #a855f7; color:#fff; width:35px; border-radius:50%;">▶</button>
            </div>
            <div id="calendar-body"></div>
        </section>
        <h2 class="neon-text-sub" style="margin-top:80px;">LATEST MEDIA</h2>
        <div class="list-wrap" id="media-list-container"></div>
    </main>
</div>

<div id="page-sns" class="page-section"><main class="container"><h2 class="neon-text-sub">OFFICIAL SNS</h2><div class="neon-box" style="max-width:500px; margin:40px auto; overflow:hidden;"><a class="twitter-timeline" data-theme="dark" data-height="600" href="https://twitter.com/Official_Obsid">Tweets</a><script async src="https://platform.twitter.com/widgets.js"></script></div></main></div>
<div id="page-notice" class="page-section"><main class="container"><h2 class="neon-text-sub">NOTICE</h2><div class="list-wrap" id="notice-list-container"></div></main></div>
<div id="page-cheki" class="page-section"><main class="container"><h2 class="neon-text-sub">CHEKI LOG</h2><div class="list-wrap" id="cheki-list-container"></div></main></div>
<div id="page-guestbook" class="page-section"><main class="container"><h2 class="neon-text-sub">GUESTBOOK</h2><p style="margin-top:40px; color:#666;">준비 중입니다.</p></main></div>

<div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">×</span>
        <div id="modal-img-wrap" style="margin-bottom:20px; border-radius:10px; overflow:hidden;"></div>
        <h2 id="modal-title" class="neon-text" style="font-size: 20px; margin-bottom: 10px;"></h2>
        <p id="modal-date" style="color:#888; font-size:12px; margin-bottom:15px;"></p>
        <div id="modal-body" style="font-size:14px; color:#ccc; white-space:pre-wrap;"></div>
    </div>
</div>

<script>
    /* [1] 데이터 설정 */
    const mySchedule = {
        "1-3": { img: "https://pbs.twimg.com/media/G-ubDR3bAAAeXV-?format=jpg&name=large", link: "#" },
        "1-29": { img: "https://pbs.twimg.com/media/G-ubDR3bAAAeXV-?format=jpg&name=large", link: "#" }
    };
    const mediaPosts = [
        { title: "페르소나5 플레이 영상", date: "2026.01.15", img: "https://images.unsplash.com/photo-1635322966219-b75ed3a90e27?auto=format&fit=crop&w=800&q=80", body: "유튜브에서 확인하세요!" }
    ];
    const noticePosts = [
        { title: "아카이브 오픈 안내", date: "2026.01.18", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80", body: "옵시드 카렌 아카이브가 정식으로 오픈되었습니다.\n많이 사랑해주세요!" }
    ];
    const chekiPosts = [
        { title: "1월 29일 체키 정산", date: "2026.01.29", img: "https://images.unsplash.com/photo-1595079676339-1534801ad6cf?auto=format&fit=crop&w=800&q=80", body: "오늘 찍은 체키 기록입니다." }
    ];

    /* [2] 기능 설정 */
    function toggleMenu() {
        document.getElementById('mobileMenu').classList.toggle('active');
        document.querySelector('.m-menu-btn').classList.toggle('active');
    }

    function handleRouting() {
        const hash = window.location.hash.replace('#', '') || 'home';
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('page-' + hash);
        if(target) target.classList.add('active');
        window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', handleRouting);

    // 모달 열기 함수
    function openModal(data, index) {
        const item = data[index];
        document.getElementById('modal-img-wrap').innerHTML = item.img ? `<img src="${item.img}" style="width:100%;">` : "";
        document.getElementById('modal-title').innerText = item.title;
        document.getElementById('modal-date').innerText = item.date;
        document.getElementById('modal-body').innerText = item.body || "";
        document.getElementById('detailModal').style.display = "flex";
    }
    function closeModal(e) {
        if(!e || e.target.classList.contains('modal-overlay') || e.target.classList.contains('modal-close')) {
            document.getElementById('detailModal').style.display = "none";
        }
    }

    function renderList(data, id) {
        const c = document.getElementById(id); if(!c || !data) return;
        c.innerHTML = data.map((p, i) => `
            <div class="post-item neon-box" onclick='openModal(${JSON.stringify(data).replace(/'/g, "&apos;")}, ${i})'>
                <div class="thumb"><img src="${p.img}" style="width:100%; height:100%; object-fit:cover;"></div>
                <div style="padding:15px; text-align:left;"><h3>${p.title}</h3><p style="font-size:12px; color:#888;">${p.date}</p></div>
            </div>
        `).join('');
    }

    const year = 2026; let currentIdx = 0;
    const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

    function initCalendar() {
        const b = document.getElementById('calendar-body');
        let h = '';
        for (let m=0; m<12; m++) {
            const f = new Date(year, m, 1).getDay(); const l = new Date(year, m+1, 0).getDate();
            h += `<div class="calendar-grid ${m===currentIdx ? 'active-month' : ''}" id="month-${m}">`;
            for(let i=0; i<f; i++) h += `<div class="day-cell"></div>`;
            for(let d=1; d<=l; d++) {
                const k = `${m+1}-${d}`; const ev = mySchedule[k];
                h += ev ? `<div class="day-cell has-event"><span class="day-num">${d}</span><img src="${ev.img}" class="event-img"></div>` : `<div class="day-cell"><span class="day-num">${d}</span></div>`;
            }
            h += `</div>`;
        }
        b.innerHTML = h;
    }

    function changeMonth(s) {
        document.getElementById(`month-${currentIdx}`).classList.remove('active-month');
        currentIdx = (currentIdx + s + 12) % 12;
        document.getElementById(`month-${currentIdx}`).classList.add('active-month');
        document.getElementById('current-month-title').innerText = `${monthNames[currentIdx]} ${year}`;
    }

    document.addEventListener("DOMContentLoaded", () => {
        initCalendar();
        handleRouting();
        renderList(mediaPosts, 'media-list-container');
        renderList(noticePosts, 'notice-list-container');
        renderList(chekiPosts, 'cheki-list-container');
    });
</script>
</body>
</html>
